packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  "@better-auth/cli": 1.4.0-beta.9
  "@better-auth/expo": 1.4.0-beta.9
  "@tailwindcss/postcss": ^4.1.16
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-form": ^1.23.8
  "@tanstack/react-query": ^5.90.8
  "@trpc/client": ^11.7.1
  "@trpc/server": ^11.7.1
  "@trpc/tanstack-react-query": ^11.7.1
  "@types/node": ^22.18.12
  "@vitejs/plugin-react": 6.1.2
  better-auth: 1.4.0-beta.9
  tailwindcss: ^4.1.16
  typescript: ~7.0.2
  zod: ^4.1.12
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0

catalogs:
  react19:
    "@types/react": ~19.2.18
    "@types/react-dom": ~19.2.7
    react: 19.2.3
    react-dom: 19.2.3

linkWorkspacePackages: true

allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  # Never built before pnpm 11, which started requiring an explicit choice.
  "@prisma/client": false
  "@prisma/engines": false
  better-sqlite3: false
  bufferutil: false
  prisma: false
  utf-8-validate: false

overrides:
  "@types/minimatch": 5.1.2
  lightningcss: 1.30.1
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
