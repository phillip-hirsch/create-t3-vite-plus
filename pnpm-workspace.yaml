packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  "@better-auth/expo": 1.7.7
  "@cloudflare/vite-plugin": 2.0.0-beta.sha-91c870c02
  "@tailwindcss/postcss": ^4.1.16
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-form": ^1.23.8
  "@tanstack/react-query": ^5.90.8
  "@trpc/client": ^11.7.1
  "@trpc/server": ^11.7.1
  "@trpc/tanstack-react-query": ^11.7.1
  "@types/node": ^22.18.12
  "@vitejs/plugin-react": 6.1.2
  auth: 1.7.7
  better-auth: 1.7.7
  cf: 1.0.0-beta.14
  tailwindcss: ^4.1.16
  typescript: ~7.0.2
  zod: ^4.6.5
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0

catalogs:
  react19:
    "@types/react": ~19.2.18
    "@types/react-dom": ~19.2.7
    react: 19.2.3
    react-dom: 19.2.3

linkWorkspacePackages: true

allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  workerd: true
  # Never built before pnpm 11, which started requiring an explicit choice.
  "@prisma/client": false
  "@prisma/engines": false
  better-sqlite3: false
  bufferutil: false
  prisma: false
  utf-8-validate: false

overrides:
  "@types/minimatch": 5.1.2
  lightningcss: 1.30.1
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite

# Miniflare 5.20261006 reuses its keep-alive connections to workerd, but
# workerd drops a connection after a response that left the request body
# unread, so the next request through `vp dev`, `vp preview` or `cf` can fail
# with "fetch failed" (cloudflare/workers-sdk#16199, cloudflare/workerd#7634).
# The patch closes the connection after every request that has a body, as
# earlier versions did. Drop it once the fix lands upstream.
patchedDependencies:
  miniflare@5.20261006.1-alpha: patches/miniflare@5.20261006.1-alpha.patch
