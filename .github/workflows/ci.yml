name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: 3
  SKIP_ENV_VALIDATION: 1

# `vp run` stops at the first failure, so each check is its own job.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Lint
        run: vp lint && vp run lint:ws

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Format
        run: vp run format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Typecheck
        run: vp run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Build
        run: vp run build
