name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: 3
  SKIP_ENV_VALIDATION: 1

# `vp run verify` is the same script the pre-push hook runs. It stops at the
# first failure. Build and the smoke suite are too slow for the hook, so they
# run only here.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Install, lint, format and typecheck
        run: vp run verify

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Build
        run: vp run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Build
        run: vp run build

      - name: Test
        run: vp run test
